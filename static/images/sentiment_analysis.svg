<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f5f7fa" />
  
  <!-- Title -->
  <text x="300" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#4a69bd">Sentiment Analysis Dashboard</text>
  
  <!-- Data visualization elements -->
  <!-- Pie chart -->
  <circle cx="150" cy="150" r="80" fill="#f5f7fa" stroke="#ddd" stroke-width="2" />
  <path d="M 150 150 L 150 70 A 80 80 0 0 1 223.92 116.08 Z" fill="#78e08f" />
  <path d="M 150 150 L 223.92 116.08 A 80 80 0 0 1 183.92 223.92 Z" fill="#4a69bd" />
  <path d="M 150 150 L 183.92 223.92 A 80 80 0 0 1 76.08 183.92 Z" fill="#eb4d4b" />
  <path d="M 150 150 L 76.08 183.92 A 80 80 0 0 1 110 73.92 Z" fill="#f6b93b" />
  
  <!-- Bar chart -->
  <rect x="300" y="100" width="30" height="120" fill="#4a69bd" rx="4" />
  <rect x="340" y="140" width="30" height="80" fill="#6a89cc" rx="4" />
  <rect x="380" y="90" width="30" height="130" fill="#4a69bd" rx="4" />
  <rect x="420" y="180" width="30" height="40" fill="#6a89cc" rx="4" />
  <rect x="460" y="120" width="30" height="100" fill="#4a69bd" rx="4" />
  
  <!-- Line chart -->
  <polyline points="100,300 150,280 200,310 250,260 300,290 350,270 400,250 450,280 500,240" 
            fill="none" stroke="#4a69bd" stroke-width="3" />
  <circle cx="100" cy="300" r="5" fill="#4a69bd" />
  <circle cx="150" cy="280" r="5" fill="#4a69bd" />
  <circle cx="200" cy="310" r="5" fill="#4a69bd" />
  <circle cx="250" cy="260" r="5" fill="#4a69bd" />
  <circle cx="300" cy="290" r="5" fill="#4a69bd" />
  <circle cx="350" cy="270" r="5" fill="#4a69bd" />
  <circle cx="400" cy="250" r="5" fill="#4a69bd" />
  <circle cx="450" cy="280" r="5" fill="#4a69bd" />
  <circle cx="500" cy="240" r="5" fill="#4a69bd" />
  
  <!-- X-axis -->
  <line x1="100" y1="320" x2="500" y2="320" stroke="#666" stroke-width="2" />
  
  <!-- Y-axis -->
  <line x1="100" y1="320" x2="100" y2="220" stroke="#666" stroke-width="2" />
  
  <!-- Decorative elements - emojis -->
  <text x="110" y="180" font-family="Arial" font-size="20">😊</text>
  <text x="130" y="150" font-family="Arial" font-size="20">😐</text>
  <text x="160" y="130" font-family="Arial" font-size="20">😡</text>
  
  <!-- Text annotations -->
  <text x="150" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Sentiment Distribution</text>
  <text x="400" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Topic Analysis</text>
  <text x="300" y="400" font-family="Arial" font-size="16" text-anchor="middle" fill="#4a69bd">Powered by Surya AI</text>
</svg>